<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10070c" />
    <meta
      name="description"
      content="Herz is a full-screen, responsive heart stage built with HTML, CSS, and vanilla JavaScript."
    />
    <title>Herz — Full-Screen Heart Stage</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="experience" aria-labelledby="page-title">
      <header class="experience-header">
        <p class="eyebrow">A LITTLE EXPERIMENT IN MOTION</p>
        <h1 id="page-title">Herz<span aria-hidden="true">.</span></h1>
        <p class="intro">Something alive is taking shape.</p>
      </header>

      <section
        class="heart-stage"
        aria-label="Heart animation preview"
        aria-describedby="stage-caption"
      >
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="heart-placeholder" aria-hidden="true">
          <span>♥</span>
        </div>
        <p class="stage-caption" id="stage-caption">
          The heart is still finding its rhythm.
        </p>
      </section>

      <p class="footer-note">Made slowly, with a little heart.</p>
    </main>
  </body>
</html>
